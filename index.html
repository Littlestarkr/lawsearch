<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HappyOh 법령 길잡이</title>
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#1b2430; --sub:#5b6776; --line:#dfe4ea;
  --brand:#14507a; --brand-ink:#ffffff; --soft:#e8f1f8; --mark:#fff3a8; --warn:#fff6e5; --warn-line:#f0c36d;
  --ok:#e7f6ee; --ok-ink:#176640;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10151b; --card:#18202a; --ink:#e8edf2; --sub:#9aa7b6; --line:#2a3542; --brand:#5aa9dd; --brand-ink:#0b1722; --soft:#17283a; --mark:#5c4f10; --warn:#2a2412; --warn-line:#6b5a22; --ok:#12301f; --ok-ink:#7fd6a4;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",-apple-system,sans-serif;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:28px 16px 60px}
header h1{margin:0;font-size:26px;letter-spacing:-.02em}
header p{margin:6px 0 0;color:var(--sub);font-size:15px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.gear{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:13px}
.box{display:flex;gap:8px;margin:22px 0 10px}
.box input{flex:1;min-width:0;font-size:17px;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);outline:none}
.box input:focus{border-color:var(--brand)}
.box button{font-size:16px;padding:0 22px;border:0;border-radius:12px;background:var(--brand);color:var(--brand-ink);font-weight:700;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--brand)}
.notice{background:var(--warn);border:1px solid var(--warn-line);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--ink);margin:0 0 18px}
.settings{display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:14px}
.settings.open{display:block}
.settings label{display:block;font-size:13px;color:var(--sub);margin:8px 0 4px}
.settings input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.settings small{color:var(--sub);display:block;margin-top:6px}
.settings button{margin-top:10px;padding:8px 16px;border:0;border-radius:8px;background:var(--brand);color:var(--brand-ink);cursor:pointer}
.understood{background:var(--soft);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:14px}
.understood b{font-weight:700}
.tag{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 8px;margin:2px 4px 2px 0;font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:18px;letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--sub)}
.badge{padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--brand);font-weight:600;font-size:12px}
.badge.rec{background:var(--ok);color:var(--ok-ink)}
.actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 14px;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.state{padding:26px 8px;text-align:center;color:var(--sub)}
.err{background:var(--warn);border:1px solid var(--warn-line);border-radius:12px;padding:14px 16px;font-size:14px}
.err code{background:var(--card);padding:1px 6px;border-radius:5px}
footer{margin-top:30px;font-size:12.5px;color:var(--sub)}
dialog{width:min(860px,100vw);max-width:100vw;height:min(88vh,100vh);border:0;border-radius:16px;padding:0;background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(10,16,24,.55)}
.dh{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;z-index:2}
.dh h2{margin:0;font-size:19px}
.dbody{padding:16px 18px 40px}
.art{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px}
.art .ah{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:4px}
.art .ah b{font-size:15px}
.art a{font-size:12.5px;color:var(--brand)}
.ln{margin:2px 0;font-size:14.5px}
.l1{padding-left:0}.l2{padding-left:16px;color:var(--ink)}.l3{padding-left:32px}
.heading{font-weight:700;color:var(--brand);margin:18px 0 8px;font-size:14px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.sec{margin:18px 0 8px;font-weight:700;font-size:15px}
.filter{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin:8px 0 12px}
details>summary{cursor:pointer;font-weight:700;padding:8px 0}
.score{font-size:12px;color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>HappyOh 법령 길잡이</h1>
      <p>정확한 법령명을 몰라도 됩니다. 궁금한 상황을 편하게 적어 보세요.</p>
    </div>
    <button class="gear" id="gear" type="button">⚙ 설정</button>
  </header>

  <div class="settings" id="settings">
    <label for="oc">법제처 API 인증키(OC)</label>
    <input id="oc" autocomplete="off">
    <label for="proxy">중계 서버 주소 (선택)</label>
    <input id="proxy" placeholder="예: https://law-proxy.your-name.workers.dev" autocomplete="off">
    <small>브라우저에서 법제처 서버를 직접 호출할 수 없을 때만 입력합니다. 비워 두면 직접 호출합니다.</small>
    <button id="save" type="button">저장</button>
  </div>

  <form class="box" id="form">
    <input id="q" type="search" placeholder="예) 직원이 퇴직금을 안 주면 어떻게 되나요?" autocomplete="off" autofocus>
    <button type="submit">검색</button>
  </form>
  <div class="chips" id="chips"></div>
  <div class="notice">참고용 검색 도구입니다. 법률 자문이 아니며, 법령은 수시로 개정되므로 중요한 판단 전에는 국가법령정보센터 원문과 전문가를 통해 확인하세요.</div>

  <div id="out"></div>

  <div class="card" style="margin-top:20px">
    <h3 style="font-size:16px">찾는 법령이 안 나오나요?</h3>
    <div class="meta">국가법령정보센터에서 직접 검색하거나 최신 개정 내용을 확인하세요.</div>
    <div class="actions"><a class="btn pri" href="https://www.law.go.kr/" target="_blank" rel="noopener">국가법령정보센터 바로가기 ↗</a></div>
  </div>

  <footer>법령 데이터 출처: 법제처 국가법령정보 공동활용(open.law.go.kr)</footer>
</div>

<dialog id="viewer">
  <div class="dh">
    <div><h2 id="vt"></h2><div class="meta" id="vm"></div></div>
    <button class="btn" id="vclose" type="button">닫기</button>
  </div>
  <div class="dbody" id="vb"></div>
</dialog>

<script>
/* ---------- 설정 ---------- */
const DEFAULT_OC = 'happyojh';
const cfg = { oc: DEFAULT_OC, proxy: '' };
try {
  const s = JSON.parse(localStorage.getItem('lawsearch.cfg') || '{}');
  if (s.oc) cfg.oc = s.oc;
  if (s.proxy) cfg.proxy = s.proxy;
} catch (e) {}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toArray = v => v == null || v === '' ? [] : Array.isArray(v) ? v : [v];
const flat = v => Array.isArray(v) ? v.flat(Infinity).join('\n') : String(v ?? '');
const norm = s => String(s).replace(/\s+/g, '').replace(/[·ㆍ‧]/g, '·');

/* ---------- 상황 → 법령 연결 사전 ---------- */
/* k: 상황을 알아보는 말, laws: 같이 볼 법령, t: 조문에서 찾을 핵심어 */

/* ---------- 질문 이해 ---------- */
const STOP = new Set(['사장','사장님','직원','회사','우리','저희','제가','내가','어떻게','어떤','무엇','뭐','경우','관련','알려줘','알려주세요','찾아줘','찾아주세요','있나요','되나요','할까요','궁금','질문','법령','법률','조항','규정','내용','하는','해야','한다','합니다','어디','언제','얼마','대해','대한','대하여','입니다','필요한','필요','방법']);
const SUFFIX = /(으로서|으로써|에서는|에게서|이라고|이라는|입니다|인가요|되나요|하나요|할까요|하면|하는|해야|에서|에게|으로|이나|이란|에는|에도|은|는|이|가|을|를|에|의|도|로|과|와|랑)$/;

function tokenize(q){
  return q.replace(/[^가-힣A-Za-z0-9\s]/g, ' ').split(/\s+/).filter(Boolean).map(t => {
    const m = t.match(SUFFIX);
    return (m && t.length - m[0].length >= 2) ? t.slice(0, -m[0].length) : t;
  }).filter(t => t.length >= 2 && !STOP.has(t));
}

function matchTopics(q){
  const nq = norm(q).toLowerCase();
  const toks = tokenize(q).map(t => t.toLowerCase());
  const res = [];
  for (const tp of TOPICS){
    let score = 0; const hit = [];
    for (const k of tp.k){
      const nk = norm(k).toLowerCase();
      if (nq.includes(nk)){ score += 3 + Math.min(nk.length, 6) / 3; hit.push(k); }
      else if (toks.some(t => (t.length >= 3 && nk.includes(t)) || (nk.length >= 2 && t.includes(nk)))){ score += 1.5; hit.push(k); }
    }
    if (score > 0) res.push({tp, score, hit});
  }
  return res.sort((a, b) => b.score - a.score).slice(0, 3);
}

/* ---------- API ---------- */
const cache = new Map();
async function api(path, params){
  const base = cfg.proxy ? cfg.proxy.replace(/\/+$/, '') : 'https://www.law.go.kr';
  const url = base + path + '?' + new URLSearchParams({OC: cfg.oc, type: 'JSON', ...params});
  if (cache.has(url)) return cache.get(url);
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 20000);
  try {
    const res = await fetch(url, {signal: ctl.signal});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const txt = await res.text();
    let json;
    try { json = JSON.parse(txt); }
    catch (e) { const err = new Error('JSON 형식이 아닌 응답입니다. 인증키(OC)나 등록 도메인을 확인하세요.'); err.kind = 'format'; throw err; }
    cache.set(url, json);
    return json;
  } finally { clearTimeout(timer); }
}

async function searchLaws(query, mode){ // mode 1 = 법령명, 2 = 본문
  const j = await api('/DRF/lawSearch.do', {target: 'law', query, search: String(mode), display: '20'});
  return toArray(j?.LawSearch?.law);
}

async function resolveLaw(name){
  const list = await searchLaws(name, 1);
  return list.find(l => norm(l.법령명한글) === norm(name)) || null;
}

/* ---------- 검색 실행 ---------- */
const KIND_ORDER = {'법률':0,'대통령령':1,'총리령':2};
let currentTerms = new Map();

async function runSearch(raw){
  const q = raw.trim();
  if (!q) return;
  history.replaceState(null, '', '?q=' + encodeURIComponent(q));
  $('chips').style.display = 'none';   // 검색하면 예시는 숨기고 결과를 바로 보여준다
  const out = $('out');
  out.innerHTML = '<div class="state">관련 법령을 찾는 중입니다…</div>';

  const topics = matchTopics(q);
  const strong = topics.filter(x => x.score >= 3);
  const toks = tokenize(q);

  // 주제가 잡히면 그 핵심어만, 못 잡히면 입력한 단어를 그대로 사용 (군더더기 단어가 검색을 흐리지 않게)
  const hits = [...new Set(strong.flatMap(x => x.hit))].sort((a, b) => b.length - a.length);
  currentTerms = new Map();
  // 질문에 적은 구체적인 명사(예: 선금, 지급한도)는 주제 핵심어보다 우선해서 찾는다
  const VERBISH = /(면|는데|는|ㄹ|을|릴|게|지|까|요|다|서|고|며|나|데)$/;
  const specific = toks.filter(t => !VERBISH.test(t) &&
    !hits.some(h => norm(h).toLowerCase().includes(t.toLowerCase()) || t.toLowerCase().includes(norm(h).toLowerCase())) &&
    !strong.some(x => x.tp.t.some(k => k.includes(t) || t.includes(k))));
  if (strong.length){
    hits.forEach(t => currentTerms.set(t, 2));
    strong.forEach(x => x.tp.t.forEach(t => currentTerms.set(t, 3)));
    specific.forEach(t => currentTerms.set(t, 4));
  } else {
    toks.forEach(t => currentTerms.set(t, 2));
  }
  const nameTerms = (strong.length ? hits : toks).slice(0, 2);

  const jobs = [];
  const names = [...new Set(strong.flatMap(x => x.tp.laws))].slice(0, 8);
  names.forEach((n, i) => jobs.push(
    resolveLaw(n).then(l => l ? [{...l, _src:'topic', _rank:100 - i, _why: strong.find(x => x.tp.laws.includes(n))?.tp.n}] : [])
  ));
  nameTerms.forEach(t => jobs.push(
    searchLaws(t, 1).then(a => a.map((l, i) => ({...l, _src:'name', _rank:60 - i * 0.1})))
  ));
  const bodyTerms = [...new Set([specific[0], strong[0]?.tp.t[0], nameTerms[0]].filter(Boolean))].slice(0, 2);
  bodyTerms.forEach(t => jobs.push(
    searchLaws(t, 2).then(a => a.slice(0, 10).map((l, i) => ({...l, _src:'body', _rank:20 - i * 0.1})))
  ));

  const settled = await Promise.allSettled(jobs);
  const ok = settled.filter(s => s.status === 'fulfilled');
  if (!ok.length){ showError(settled[0]?.reason); return; }

  const byId = new Map();
  ok.flatMap(s => s.value).forEach(l => {
    const prev = byId.get(l.법령ID);
    if (!prev || l._rank > prev._rank) byId.set(l.법령ID, l);
  });
  const results = [...byId.values()].sort((a, b) =>
    (b._rank - a._rank) || ((KIND_ORDER[a.법령구분명] ?? 9) - (KIND_ORDER[b.법령구분명] ?? 9))
  ).slice(0, 15);

  renderResults(q, strong, toks, results);
}

function showError(err){
  const msg = err?.message || '';
  const blocked = err instanceof TypeError || /Failed to fetch|NetworkError|Load failed|aborted/i.test(msg);
  $('out').innerHTML = blocked
    ? `<div class="err"><b>법제처 서버에 연결하지 못했습니다.</b><br>
       브라우저가 법제처 서버를 직접 호출하는 것을 막았을 가능성이 큽니다(CORS 제한).<br>
       <b>해결:</b> 같이 드린 <code>worker.js</code>를 Cloudflare Workers에 올린 뒤, 위쪽 <code>⚙ 설정</code>의 중계 서버 주소에 입력하면 됩니다.</div>`
    : `<div class="err"><b>검색 중 문제가 생겼습니다.</b><br>${esc(msg || '알 수 없는 오류')}<br>
       인증키(OC)가 <code>${esc(cfg.oc)}</code>로 맞는지, 신청 때 등록한 도메인에서 열었는지 확인해 주세요.</div>`;
}

function fmtDate(s){ return s && s.length === 8 ? `${s.slice(0,4)}.${s.slice(4,6)}.${s.slice(6,8)}` : (s || ''); }
function lawUrl(name){ return 'https://www.law.go.kr/법령/' + encodeURIComponent(name.replace(/\s+/g, '')); }

function renderResults(q, strong, toks, results){
  const out = $('out');
  let html = '';
  if (strong.length){
    html += `<div class="understood"><b>이렇게 이해했습니다.</b> ` +
      strong.map(x => `<span class="tag">${esc(x.tp.n)}</span>`).join('') +
      `<br><span style="color:var(--sub)">찾는 핵심어: ${[...currentTerms.keys()].slice(0, 10).map(esc).join(', ')}</span></div>`;
  } else if (toks.length){
    html += `<div class="understood"><b>입력하신 말을 그대로 검색했습니다.</b> 상황을 조금 더 구체적으로 적으면 더 잘 찾습니다. <br><span style="color:var(--sub)">검색어: ${toks.map(esc).join(', ')}</span></div>`;
  }
  if (!results.length){
    out.innerHTML = html + '<div class="state">검색 결과가 없습니다. 다른 표현으로 다시 적어 보세요.</div>';
    return;
  }
  html += results.map((l, i) => {
    const why = l._src === 'topic' ? `<span class="badge rec">추천 · ${esc(l._why || '')}</span>`
              : l._src === 'name' ? '<span class="badge">법령명 일치</span>'
              : '<span class="badge">조문 내용 일치</span>';
    return `<div class="card">
      <h3>${esc(l.법령명한글)}</h3>
      <div class="meta">${why}<span>${esc(l.법령구분명 || '')}</span><span>·</span><span>${esc(l.소관부처명 || '')}</span><span>·</span><span>시행 ${fmtDate(l.시행일자)}</span>${l.법령약칭명 ? `<span>· 약칭 ${esc(l.법령약칭명)}</span>` : ''}</div>
      <div class="actions">
        <button class="btn pri" data-i="${i}" type="button">관련 조문 보기</button>
        <a class="btn" href="${lawUrl(l.법령명한글)}" target="_blank" rel="noopener">국가법령정보센터 원문</a>
      </div>
    </div>`;
  }).join('');
  out.innerHTML = html;
  out.querySelectorAll('button[data-i]').forEach(b => b.addEventListener('click', () => openLaw(results[+b.dataset.i])));
}

/* ---------- 조문 보기 ---------- */
function parseArticle(a){
  const lines = [];
  if (a.조문내용) lines.push({t: flat(a.조문내용).trim(), l: 0});
  toArray(a.항).forEach(h => {
    if (typeof h === 'string'){ lines.push({t: h, l: 1}); return; }
    if (h.항내용) lines.push({t: flat(h.항내용).trim(), l: 1});
    toArray(h.호).forEach(ho => {
      if (ho.호내용) lines.push({t: flat(ho.호내용).trim(), l: 2});
      toArray(ho.목).forEach(m => { if (m.목내용) lines.push({t: flat(m.목내용).trim(), l: 3}); });
    });
  });
  const head = (lines[0]?.t.match(/^제\s?\d+조(?:의\s?\d+)?(?:\s?\([^)]*\))?/) || [''])[0];
  const no = (head.match(/^제\s?\d+조(?:의\s?\d+)?/) || [''])[0].replace(/\s/g, '');
  return {
    lines, head, no,
    isHeading: a.조문여부 === '전문',
    title: a.조문제목 || '',
    text: lines.map(x => x.t).join(' ')
  };
}

function scoreArticle(art, terms){
  if (art.isHeading) return 0;
  let s = 0;
  for (const [t, w] of terms){
    const cnt = art.text.split(t).length - 1;
    if (cnt) s += w * Math.min(cnt, 3);
    if (art.title && art.title.includes(t)) s += 5;
  }
  return s;
}

function highlighter(terms){
  const list = [...terms].filter(t => t.length >= 1).sort((a, b) => b.length - a.length)
    .map(t => esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if (!list.length) return s => esc(s);
  const re = new RegExp('(' + list.join('|') + ')', 'g');
  return s => esc(s).replace(re, '<mark>$1</mark>');
}

function artHtml(art, law, hl, withScore){
  const link = art.no ? `https://www.law.go.kr/법령/${encodeURIComponent(law.name.replace(/\s+/g, ''))}/${encodeURIComponent(art.no)}` : '';
  return `<div class="art">
    <div class="ah"><b>${esc(art.head || '조문')}</b>${link ? `<a href="${link}" target="_blank" rel="noopener">원문 ↗</a>` : ''}</div>
    ${art.lines.map((x, i) => {
      if (i === 0 && art.head) { const rest = x.t.slice(art.head.length).trim(); return rest ? `<div class="ln l1">${hl(rest)}</div>` : ''; }
      return `<div class="ln l${Math.max(x.l,1)}">${hl(x.t)}</div>`;
    }).join('')}
  </div>`;
}

async function openLaw(l){
  const dlg = $('viewer');
  $('vt').textContent = l.법령명한글;
  $('vm').innerHTML = `<span>${esc(l.법령구분명 || '')}</span><span>·</span><span>${esc(l.소관부처명 || '')}</span><span>·</span><span>시행 ${fmtDate(l.시행일자)}</span>
    <a class="btn" style="padding:3px 10px;font-size:12.5px" href="${lawUrl(l.법령명한글)}" target="_blank" rel="noopener">원문 ↗</a>`;
  $('vb').innerHTML = '<div class="state">조문을 불러오는 중입니다…</div>';
  if (!dlg.open) dlg.showModal();

  let data;
  try { data = await api('/DRF/lawService.do', {target: 'law', MST: l.법령일련번호}); }
  catch (e) { $('vb').innerHTML = `<div class="err">조문을 불러오지 못했습니다. ${esc(e.message || '')}</div>`; return; }

  const law = {name: l.법령명한글};
  const arts = toArray(data?.법령?.조문?.조문단위).map(parseArticle).filter(a => a.lines.length);
  if (!arts.length){ $('vb').innerHTML = '<div class="state">이 법령은 조문 형식으로 제공되지 않습니다. 위의 원문 링크를 이용하세요.</div>'; return; }

  const hl = highlighter(currentTerms.keys());
  const ranked = arts.map(a => ({a, s: scoreArticle(a, currentTerms)})).filter(x => x.s > 0).sort((x, y) => y.s - x.s).slice(0, 6);

  let html = '';
  if (ranked.length){
    html += `<div class="sec">질문과 관련 깊은 조문 <span class="score">(핵심어 일치 순)</span></div>` + ranked.map(x => artHtml(x.a, law, hl)).join('');
  } else if (currentTerms.size){
    html += `<div class="state">입력하신 핵심어와 직접 일치하는 조문을 찾지 못했습니다. 아래 전체 조문에서 찾아 보세요.</div>`;
  }
  html += `<details id="all"><summary>전체 조문 보기 (${arts.length}개)</summary>
    <input class="filter" id="flt" placeholder="이 법령 안에서 단어로 찾기">
    <div id="alist"></div></details>`;
  $('vb').innerHTML = html;

  const alist = $('alist');
  const paint = () => {
    const f = $('flt').value.trim();
    const h2 = f ? highlighter([...currentTerms.keys(), f]) : hl;
    const shown = (f ? arts.filter(a => a.text.includes(f)) : arts).slice(0, 300);
    alist.innerHTML = shown.map(a => a.isHeading
      ? `<div class="heading">${esc(a.lines[0].t)}</div>` : artHtml(a, law, h2)).join('') || '<div class="state">일치하는 조문이 없습니다.</div>';
  };
  $('all').addEventListener('toggle', () => { if ($('all').open && !alist.innerHTML) paint(); });
  $('flt').addEventListener('input', paint);
  $('vb').scrollTop = 0;
}

/* ---------- 초기화 ---------- */
$('chips').innerHTML = EXAMPLES.map(e => `<button class="chip" type="button">${esc(e)}</button>`).join('');
$('chips').addEventListener('click', e => { if (e.target.classList.contains('chip')){ $('q').value = e.target.textContent; runSearch(e.target.textContent); } });
$('q').addEventListener('input', () => {
  if (!$('q').value.trim()){ $('chips').style.display = ''; $('out').innerHTML = ''; history.replaceState(null, '', location.pathname); }
});
$('form').addEventListener('submit', e => { e.preventDefault(); runSearch($('q').value); });
$('vclose').addEventListener('click', () => $('viewer').close());
$('viewer').addEventListener('click', e => { if (e.target === $('viewer')) $('viewer').close(); });
$('gear').addEventListener('click', () => { $('oc').value = cfg.oc; $('proxy').value = cfg.proxy; $('settings').classList.toggle('open'); });
$('save').addEventListener('click', () => {
  cfg.oc = $('oc').value.trim() || DEFAULT_OC;
  cfg.proxy = $('proxy').value.trim();
  try { localStorage.setItem('lawsearch.cfg', JSON.stringify(cfg)); } catch (e) {}
  cache.clear();
  $('settings').classList.remove('open');
});
const initQ = new URLSearchParams(location.search).get('q');
if (initQ){ $('q').value = initQ; runSearch(initQ); }
</script>
